spring:
  application:
    name: ops-engine

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsengine}
    username: ${DB_USER:opsengine}
    password: ${DB_PASSWORD:opsengine}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

app:
  security:
    jwt:
      # Sin valor por defecto a propósito: si falta JWT_SECRET, la aplicación no arranca.
      # El perfil `dev` define uno de desarrollo; el repositorio es público y un secreto
      # publicado no debe poder usarse fuera de desarrollo.
      secret: ${JWT_SECRET}
      ttl: PT8H

  cors:
    # Orígenes del panel. Explícitos a propósito: un comodín con credenciales dejaría que
    # cualquier sitio llame a la API desde el navegador de quien esté logueado.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  decision:
    # fake (por defecto) no sale a la red. jev usa la API de TypeSafe y necesita TYPESAFE_API_KEY.
    provider: ${DECISION_PROVIDER:fake}
    jev:
      base-url: https://api.typesafe.ai
      api-key: ${TYPESAFE_API_KEY:}
      model: jev-latest
      connect-timeout: PT2S
      read-timeout: PT10S
      max-attempts: 3

  routing:
    policy:
      # Cambiar cualquier umbral exige subir la versión: es lo que permite reconstruir
      # después con qué reglas se decidió un ticket viejo.
      version: "2026-11-09.1"
      min-skill-recognized: 0.7
      min-skill-confidence: 0.6
      critical-noul: 0.7
      critical-urgency: 0.6
      sla-at-risk-window: PT30M
      # Debajo de esto el ticket no se entiende y se le piden datos al cliente.
      min-enough-information: 0.5

    worker:
      # Rutea en segundo plano. El endpoint de ruteo sigue existiendo para la demo.
      enabled: true
      interval-ms: 2000
      batch-size: 25

  outbox:
    dispatcher:
      enabled: true
      interval-ms: 5000


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.franco.opsengine: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    jwt:
      # Secreto de desarrollo. Público a propósito: solo sirve con el perfil `dev`.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}

logging:
  level:
    com.franco.opsengine: DEBUG
