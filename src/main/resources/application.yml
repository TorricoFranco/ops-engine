spring:
  application:
    name: ops-engine

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsengine}
    username: ${DB_USER:opsengine}
    password: ${DB_PASSWORD:opsengine}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

app:
  security:
    jwt:
      # Sin valor por defecto a propósito: si falta JWT_SECRET, la aplicación no arranca.
      # El perfil `dev` define uno de desarrollo; el repositorio es público y un secreto
      # publicado no debe poder usarse fuera de desarrollo.
      secret: ${JWT_SECRET}
      ttl: PT8H

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.franco.opsengine: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    jwt:
      # Secreto de desarrollo. Público a propósito: solo sirve con el perfil `dev`.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}

logging:
  level:
    com.franco.opsengine: DEBUG
