global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ops-engine
    metrics_path: /actuator/prometheus
    static_configs:
      # La API corre en la máquina del host, no en este compose: se la levanta con
      # `mvn spring-boot:run` para poder depurarla. 9091 es el puerto de management.
      - targets: ["host.docker.internal:9091"]
