services:
  postgres:
    image: postgres:17
    container_name: ops-engine-postgres
    environment:
      POSTGRES_DB: opsengine
      POSTGRES_USER: opsengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsengine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsengine -d opsengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ops-engine-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # La API corre en el host, no acá: se la levanta con `mvn spring-boot:run` para poder
      # depurarla. En Linux este nombre no existe solo, así que se declara.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: ops-engine-grafana
    depends_on:
      - prometheus
    environment:
      # Es un entorno de demostración en localhost. Si esto alguna vez sale de la máquina,
      # lo primero que hay que sacar es esta línea.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
